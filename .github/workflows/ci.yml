name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/agent-work/index.ts supabase/functions/github-agent/index.ts supabase/functions/asset-import/index.ts

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build

      - name: Validate browser game smoke runner syntax
        run: node --check scripts/browser-game-smoke.cjs
