name: DEBS real Ollama inference smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "inference/smoke_test.py"
      - ".github/workflows/debs-real-inference.yml"

permissions:
  contents: read

concurrency:
  group: debs-real-inference-smoke
  cancel-in-progress: false

jobs:
  real-inference:
    name: Run Qwen 2.5 3B through the real DEBS gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gateway dependencies
        run: python -m pip install -r inference/gateway/requirements.txt

      - name: Start temporary Ollama runtime
        run: |
          docker run --detach --name debs-ollama \
            --publish 127.0.0.1:11434:11434 \
            --env OLLAMA_NUM_PARALLEL=1 \
            ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs debs-ollama
          exit 1

      - name: Download the real Qwen 2.5 3B model
        run: docker exec debs-ollama ollama pull qwen2.5:3b

      - name: Configure temporary gateway credentials
        shell: bash
        run: |
          echo "DEBS_INFERENCE_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "OLLAMA_OPENAI_BASE_URL=http://127.0.0.1:11434/v1" >> "$GITHUB_ENV"
          echo "DEBS_MODEL=qwen2.5:3b" >> "$GITHUB_ENV"
          echo "DEBS_MAX_CONCURRENT_REQUESTS=1" >> "$GITHUB_ENV"

      - name: Start the DEBS gateway
        working-directory: inference/gateway
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8080 > /tmp/debs-gateway.log 2>&1 &
          echo $! > /tmp/debs-gateway.pid

      - name: Verify a real model response through DEBS
        run: python inference/smoke_test.py

      - name: Show gateway logs if the smoke test fails
        if: failure()
        run: |
          if [ -f /tmp/debs-gateway.log ]; then cat /tmp/debs-gateway.log; fi
          docker logs debs-ollama || true

      - name: Stop temporary Ollama runtime
        if: always()
        run: docker rm --force debs-ollama || true
