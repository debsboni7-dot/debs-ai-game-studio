# Overlay for a private Linux GPU host with NVIDIA Container Toolkit installed.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
