services:
  ollama:
    image: ollama/ollama:latest
    container_name: debs-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  model-init:
    image: ollama/ollama:latest
    container_name: debs-model-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      DEBS_MODEL: ${DEBS_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$\u007bDEBS_MODEL\u007d\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  debs-inference:
    build:
      context: ./gateway
    container_name: debs-inference
    restart: unless-stopped
    environment:
      OLLAMA_OPENAI_BASE_URL: http://ollama:11434/v1
      DEBS_INFERENCE_API_KEY: ${DEBS_INFERENCE_API_KEY:?Set DEBS_INFERENCE_API_KEY in inference/.env}
      DEBS_MODEL: ${DEBS_MODEL:-qwen2.5:3b}
      DEBS_MAX_CONCURRENT_REQUESTS: ${DEBS_MAX_CONCURRENT_REQUESTS:-2}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

volumes:
  ollama_data:
