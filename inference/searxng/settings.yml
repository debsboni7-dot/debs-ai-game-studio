use_default_settings: true

general:
  debug: false
  instance_name: "DEBS Private Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # The container's SEARXNG_SECRET environment variable overrides this placeholder.
  secret_key: "replace-through-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  public_instance: false
